[package]
name = "tunebox-sync"
description = "TuneBox device sync: recognises digital audio players, plans what to copy and delete, and carries it out."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
# MTP players simulated in memory, for tests of the crates above.
simulator = ["tunebox-mtp/simulator"]

[dependencies]
tunebox-model = { workspace = true }
tunebox-mtp = { workspace = true }
craft-atomic = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tunebox-mtp = { workspace = true, features = ["simulator"] }
