[package]
name = "tunebox-playback"
description = "TuneBox playback: the play queue with shuffle and repeat, and an audio player thread with sound output through cpal."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["cpal"]
# Sound output through the system's audio device. Without it only `NullOutput` exists, which is
# what headless tools and tests use.
cpal = ["dep:cpal"]

[dependencies]
tunebox-model = { workspace = true }
tunebox-audio = { workspace = true }
rtrb = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
cpal = { workspace = true, optional = true }

[dev-dependencies]
tempfile = { workspace = true }
