[package]
name = "tunebox-engine"
description = "TuneBox engine façade: the session every frontend talks to, background jobs and the command registry."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
default = ["sound", "drives", "musicbrainz"]
# Sound output through the system audio device (cpal).
sound = ["tunebox-playback/cpal"]
# Physical CD drives.
drives = ["tunebox-rip/drives"]
# Requests to MusicBrainz ("Get Track Names", finding album artwork) and the Cover Art
# Archive, only ever when the listener asks. Without it the engine says it has no network.
musicbrainz = ["tunebox-rip/musicbrainz", "tunebox-metabrainz/http"]

[dependencies]
tunebox-model = { workspace = true }
tunebox-library = { workspace = true }
tunebox-tags = { workspace = true }
tunebox-audio = { workspace = true }
tunebox-import = { workspace = true }
tunebox-audiobook = { workspace = true }
tunebox-playback = { workspace = true }
tunebox-rip = { workspace = true }
tunebox-sync = { workspace = true }
tunebox-metabrainz = { workspace = true }
tunebox-plugins = { workspace = true }
craft-atomic = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# Test plug-ins from WebAssembly text.
wat = { workspace = true }
# Making test pictures.
image = { workspace = true }
tunebox-sync = { workspace = true, features = ["simulator"] }
tunebox-mtp = { workspace = true, features = ["simulator"] }
